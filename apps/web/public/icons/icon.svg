<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140728" />
      <stop offset="50%" stop-color="#08080c" />
      <stop offset="100%" stop-color="#24083d" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Container -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.1)" stroke-width="4"/>
  
  <!-- Glowing Rings -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#glowGrad)" stroke-width="6" opacity="0.3"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="url(#glowGrad)" stroke-width="8" opacity="0.6" stroke-dasharray="16 8"/>
  
  <!-- Core VIBE Logo / Sound Disc -->
  <circle cx="256" cy="256" r="90" fill="#08080c" stroke="url(#glowGrad)" stroke-width="12" filter="url(#glow)"/>
  
  <!-- Soundwave Bars Center -->
  <rect x="186" y="226" width="16" height="60" rx="8" fill="url(#glowGrad)" filter="url(#glow)"/>
  <rect x="221" y="196" width="16" height="120" rx="8" fill="url(#glowGrad)" filter="url(#glow)"/>
  <rect x="256" y="176" width="16" height="160" rx="8" fill="#ffffff" filter="url(#glow)"/>
  <rect x="291" y="206" width="16" height="100" rx="8" fill="url(#glowGrad)" filter="url(#glow)"/>
  <rect x="326" y="236" width="16" height="40" rx="8" fill="url(#glowGrad)" filter="url(#glow)"/>
</svg>
